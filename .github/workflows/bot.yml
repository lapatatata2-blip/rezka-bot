name: rezka bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: rezka-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: yt-dlp
        run: |
          mkdir -p bin
          curl -fsSL -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x bin/yt-dlp
          ./bin/yt-dlp --version
      - name: Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
          REZKA_YTDLP: ${{ github.workspace }}/bin/yt-dlp
          MAX_RUNTIME_MS: '570000'
        run: node bot.js
