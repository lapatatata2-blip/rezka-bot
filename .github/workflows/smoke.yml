name: smoke slice

on: workflow_dispatch

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Slice
        env:
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: node smoke.js
