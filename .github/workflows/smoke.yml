name: smoke slice

on: workflow_dispatch

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: yt-dlp
        run: |
          mkdir -p bin
          curl -fsSL -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x bin/yt-dlp
          ./bin/yt-dlp --version
      - name: Slice
        env:
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
          REZKA_YTDLP: ${{ github.workspace }}/bin/yt-dlp
        run: node smoke.js
