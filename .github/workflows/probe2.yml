name: probe clients

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version
        run: ./node_modules/youtube-dl-exec/bin/yt-dlp --version
      - name: Try clients
        shell: bash
        run: |
          set +e
          YT=./node_modules/youtube-dl-exec/bin/yt-dlp
          for vid in dQw4w9WgXcQ jNQXAC9IVRw; do
            for c in default android tv_embedded ios mweb web_safari; do
              if [ "$c" = "default" ]; then A=""; else A="--extractor-args"; fi
              if [ "$c" = "default" ]; then ARGS=""; else ARGS="youtube:player_client=$c"; fi
              OUT=$($YT --js-runtimes node --no-warnings --skip-download --print "%(title)s" $A "$ARGS" "https://www.youtube.com/watch?v=$vid" 2>&1 | tail -1)
              echo "$vid $c -> ${OUT:0:110}"
            done
          done
